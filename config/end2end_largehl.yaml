### EXPERIMENT: LARGE-HIGHLIGHT REMOVAL (large-hole inpainting)
### Hypothesis: the model leaves a flat gray, patch-seamed center when a single
### LARGE specular region (e.g. wet tissue under strong light) covers a big part
### of the frame. Two compounding causes, both fixed here:
###   A. Training distribution: the synthetic supervision only ever produced
###      small/medium Blinn-Phong lobes + tiny GEOMETRIC_HIGHLIGHTS micro-blobs.
###      The token inpainter was never trained on holes this big, so it has no
###      learned prior for their interior. FIX -> LARGE_HIGHLIGHTS: composite a
###      big, irregular, soft-edged, saturated plateau into the highlight map H
###      (make_large_highlight_mask). It flows through rgb_highlighted + the
###      inpaint/supervision masks, so the inpainter is trained to reconstruct
###      large-hole interiors against the clean tokens.
###   B. Local-prior seed reach: TokenInpainter_Prior seeds masked tokens by
###      diffusing a box-mean of visible neighbours inward; reach = iters*(kernel//2)
###      tokens. At 896px the grid is 56x56, so a centred large hole needs reach
###      ~28. FIX -> LOCAL_PRIOR_KERNEL 5->9 and PRIOR_FILL_ITERS 1->12 (reach 48),
###      so deep interior tokens get a content-aware seed instead of collapsing to
###      ~0 (the flat-gray seed). GEOMETRIC_HIGHLIGHTS (sharp micro-blobs) and the
###      INTENSITY/FALLOFF/DENSITY saturation knobs are kept from the prior run.
### EVAL: FREEZE_VAL_HIGHLIGHTS is intentionally UNSET, so validation mirrors the
### (now large-hole) training distribution and the val PANELS actually show this
### failure case. Judge primarily on the logged qualitative panels; the scalar
### in-mask SSIM is not comparable to prior soft-lobe-eval runs (see notes in
### geometric-roughness analysis). For a comparable frozen large-hole metric,
### set FREEZE_VAL_HIGHLIGHTS: True and the engine will render VAL_LARGE_HIGHLIGHTS
### deterministically (the large-blob RNG is torch-seedable, unlike geo-blobs).

parameters:

  ### MODEL ARCHITECTURE                                                       
  MODEL:
    value:
      MODEL_CLASS: "UnReflect_Model_TokenInpainter"  # Main model class name (must match class in models.py)
      MODEL_MODULE: "models"  # Module name to import model classes from (default: "models")
      DETACH_INPAINTED_TOKENS_FOR_DECODER: False  # Allow decoder loss to flow into the inpainter, correcting token-level colour residuals
      RGB_ENCODER:
        ENCODER: "facebook/dinov3-vitl16-pretrain-lvd1689m"  # DINOv3 encoder model name (HuggingFace format)
        IMAGE_SIZE: 896  # Input image size (height and width in pixels)
        RETURN_SELECTED_LAYERS: [3, 6, 9, 12]  # Transformer layer indices to extract features from (0-indexed)
        RGB_ENCODER_LR: 0.0  # Learning rate for RGB encoder (0.0 = frozen, must be explicitly set)
      DECODERS:
        diffuse:
          FEATURE_DIM: 1024  # Feature dimension for decoder (should match encoder output)
          REASSEMBLE_OUT_CHANNELS: [768,1024,1536,2048]  # Output channels for each decoder stage (DPT-style reassembly)
          REASSEMBLE_FACTORS: [4.0, 2.0, 1.0, 0.5]  # Spatial upsampling factors for each stage
          READOUT_TYPE: "ignore"  # Readout type for DPT decoder ("ignore", "project", etc.)
          FROM_PRETRAINED: "diffuse_decoder.pt"  # Path to pretrained decoder weights (optional)
          USE_BN: False  # Use batch normalization in decoder
          DROPOUT: 0.0  # Detail recovery: was 0.05. Drop decoder regularization so it can commit to sharp pixel-level detail.
          OUTPUT_IMAGE_SIZE: [896,896]  # Output image resolution [height, width]
          OUTPUT_CHANNELS: 3  # Number of output channels (3 for RGB diffuse image)
          DECODER_LR: 0.0002 # Detail recovery: was 5e-5. Now honored on resume via REAPPLY_LRS_ON_RESUME — drives the (now fully-unfrozen) diffuse decoder for pixel detail.
          NUM_FUSION_BLOCKS_TRAINABLE: 4  # Detail recovery: was 1. Unfreeze ALL fusion blocks incl. high-res [0]/[1]/[2] (96/48/24px) that carry fine spatial detail.
          TRAIN_RGB_HEAD: True  # Whether to train RGB head (true/false, null = train if DECODER_LR != 0)
        highlight:
          FEATURE_DIM: 1024  # Feature dimension for highlight decoder
          REASSEMBLE_OUT_CHANNELS: [96,192,384,768]  # Output channels for each decoder stage
          REASSEMBLE_FACTORS: [4.0, 2.0, 1.0, 0.5]  # Spatial upsampling factors for each stage
          READOUT_TYPE: "ignore"  # Readout type for DPT decoder
          FROM_PRETRAINED: "highlight_decoder.pt"  # Path to pretrained decoder weights (optional)  
          USE_BN: False  # Use batch normalization in decoder
          DROPOUT: 0.1  # Dropout rate in decoder layers
          OUTPUT_IMAGE_SIZE: [896,896]  # Output image resolution [height, width]
          OUTPUT_CHANNELS: 1  # Number of output channels (1 for highlight mask)
          DECODER_LR: 0.0 #1.0e-5  # Custom learning rate for decoder (0.0 = frozen, 1.0 = same as base LR)
          NUM_FUSION_BLOCKS_TRAINABLE: null  # Number of fusion blocks to train (0-4, null = train all if DECODER_LR != 0)
      TOKEN_INPAINTER:
        TOKEN_INPAINTER_CLASS: "TokenInpainter_Prior"  # Token inpainter class name
        TOKEN_INPAINTER_MODULE: "token_inpainters"  # Module name to import token inpainter from
        # FROM_PRETRAINED: "../DATA/results/logical-dawn-1096/models/full_model_weights.pt"  # Token inpainter weights from pretraining run logical-dawn-1096
        TOKEN_INPAINTER_LR: 1.0e-4  # Lowered from 5e-4: inpainter color already converged (~1.1e-4 at crash); keep it gentle on resume so the detail push doesn't disturb the good color.
        DEPTH: 6  # Number of transformer blocks
        HEADS: 16 # Number of attention heads
        DROP: 0.00 # Dropout rate 
        USE_POSITIONAL_ENCODING: True  # Enable 2D sinusoi  dal positional encodings
        USE_FINAL_NORM: True  # Enable final LayerNorm before output projection
        USE_LOCAL_PRIOR: True  # Blend local mean prior for masked seeds
        LOCAL_PRIOR_WEIGHT: 0.4
        LOCAL_PRIOR_KERNEL: 9  # Raised 5->9 for large holes: reach = PRIOR_FILL_ITERS*(KERNEL//2) tokens. With 9 -> 4 tokens/iter.
        SEED_NOISE_STD: 0.02  # Standard deviation of noise added to masked seeds during training

  # FORWARD PASS PARAMETERS
  INPAINT_MASK_THRESHOLD:
    value: 0.2  # Threshold for inpaint mask
  INPAINT_MASK_DILATION:
    value: 9 # Dilation kernel size (pixels) for inpaint mask - Must be odd
  PRIOR_FILL_ITERS:
    value: 12  # Diffusion iterations of the token local-mean prior. reach = ITERS*(LOCAL_PRIOR_KERNEL//2) = 12*4 = 48 tokens >= 28 (centre of a full-frame hole on the 56x56 grid). Was effectively 1 (default) in the prior end2end -> large-hole centres seeded ~0 -> flat gray.

  USE_TORCH_COMPILE:  # Enable PyTorch 2.0 torch.compile for faster training (experimental)
    value: False
  DISTRIBUTE:
    value: "ddp"

  ### DATA                                                                      
  DATASETS:
    value:
      # Reserved key: key-value pairs here override the same keys for every dataset (per-dataset entries still override this).
      SCRREAM:
        VAL_SCENES: ["scene10", "scene04"]  # List of validation scene names
        RESIZE_MODE: "resize+crop"  # Image resizing mode: "resize", "crop", "resize+crop", or "pad"
        SAMPLE_EVERY_N: 6  # Load every Nth frame from each scene (1 = all frames, 4 = every 4th frame)
        
      HOUSECAT6D:
        VAL_SCENES: ["val_scene1","val_scene2"]  # Validation scene names
        RESIZE_MODE: "resize+crop"  # Image resizing mode
        SAMPLE_EVERY_N: 4  # Load every Nth frame

      CROMO:
        TRAIN_SCENES: ["kitchen"]  # Training scene names (list or string)
        VAL_SCENES: ["station"]  # Validation scene names (optional)
        RESIZE_MODE: "resize"  # Image resizing mode
        SAMPLE_EVERY_N: 30  # Load every Nth frame
    
      PSD:
        TRAIN_SCENES: "PSD_Train"  # Training scene name (string or list)
        VAL_SCENES: "PSD_Val"  # Validation scene name (string or list)
        RESIZE_MODE: "resize+crop"  # Image resizing mode
        SAMPLE_EVERY_N: 1  # Load every Nth frame (1 = all frames)

      SCARED:
        VAL_SCENES: ["v22","v23","v24","v25","v26","v27","v28","v29","v30","v31","v32","v33","v34"]  # Validation scene names
        RESIZE_MODE: "resize+crop"  # Image resizing mode
        SAMPLE_EVERY_N: 8  # Load every Nth frame
              
      STEREOMIS_TRACKING:
        VAL_SCENES: ["P2_2"]  # Validation scene names
        RESIZE_MODE: "resize+crop"  # Image resizing mode
        SAMPLE_EVERY_N: 2  # Load every Nth frame

      CHOLEC80:
        TRAIN_SCENES: ["train"]  # Validation scene names
        VAL_SCENES: ["test"]  # Validation scene names
        RESIZE_MODE: "resize+crop"  # Image resizing mode
        SAMPLE_EVERY_N: 40  # Load every Nth frame

      SUNRGBD:
        VAL_SCENES: ["realsense"]  # Validation scene names
        RESIZE_MODE: "resize+crop"  # Image resizing mode
        SAMPLE_EVERY_N: 4  # Load every Nth frame

      # SCANNET:
      #   TRAIN_SCENES: ["train"]
      #   VAL_SCENES: ["val"]
      #   RESIZE_MODE: "resize+crop"
      #   SAMPLE_EVERY_N: 5

      OPENIMAGESV7:
        TRAIN_SCENES: ["thescene"]
        # VAL_SCENES: [""]
        RESIZE_MODE: "resize+crop"
        SAMPLE_EVERY_N: 5
      
      ENDOSYNTH:
        TRAIN_SCENES: ["scene"]
        # VAL_SCENES: ["val"]
        RESIZE_MODE: "resize+crop"
        SAMPLE_EVERY_N: 1

      ALL_DATASETS:
        FEW_IMAGES: False   # Override FEW_IMAGES for all datasets (for quick debugging set True)
        TARGET_SIZE: [896,896]  # Override target image size [height, width] for all datasets
        LOAD_RGB_ONLY: True        

  BATCH_SIZE: # Max batch size with img size 896 is 32
    value: 6    # Number of samples per batch (adjust based on GPU memory)
  NUM_WORKERS:
    value: 12  # Number of data loading worker processes (0 = main process only, "auto" = 90% of CPU affinity)
  SHUFFLE:
    value: True  # Shuffle training data each epoch (False for validation/test)
  PIN_MEMORY:
    value: True  # Pin memory in DataLoader for faster GPU transfer (recommended: True)
  PREFETCH_FACTOR:
    value: 2  # Number of batches to prefetch per worker (higher = more memory usage)
  
  ### HIGHLIGHTS                                                        
  MOGE_MODEL:
    value: "Ruicheng/moge-2-vits-normal"  # MoGe model name for normal estimation (HuggingFace format)
  SURFACE_ROUGHNESS:
    value: [60.0, 2000.0]  # Blinn-Phong surface roughness exponent — sampled log-uniformly in this range (higher = sharper highlights)
  INTENSITY:
    value: [0.8, 2.5]  # Raised ceiling >1 (was [0.8,1.0]). H is per-image-normalized to peak 1.0, so intensity>1 drives a BROAD region past the alpha=1 clamp -> genuine 255/255/255 saturated plateaus (the "pure-white blob" failure case) instead of a single bright lobe peak.
  LIGHT_DISTANCE_RANGE:
    value: [0.0, 1]  # Range for light source distance sampling [min, max] (normalized)
  LIGHT_LEFT_RIGHT_ANGLE:
    value: [0, 360]  # Range for light source horizontal angle [min, max] in degrees
  LIGHT_ABOVE_BELOW_ANGLE:
    value: [0, 360]  # Range for light source vertical angle [min, max] in degrees
  DATASET_HIGHLIGHT_DILATION:
    value: 25  # Dilation kernel size (pixels) for dataset highlight masks
  DATASET_HIGHLIGHT_THRESHOLD:
    value: 0.60  # Lowered from 0.85 to aggressively mask real highlights from supervision
  DATASET_HIGHLIGHT_USE_LUMINANCE:
    value: True  # If True, use perceptually-weighted luminance (0.299*R + 0.587*G + 0.114*B) for dataset highlights; if False, use simple mean brightness
  HIGHLIGHT_COLOR:
    value: [1.0, 1.0, 1.0]  # RGB color for synthetic highlights (normalized 0-1)
  HIGHLIGHT_FALLOFF:
    value: [0.0, 0.5]  # Re-enabled (was [0,0]). Crops the soft Blinn-Phong halo and rescales the survivors -> hard-edged, high-gradient highlights. NOTE: the prior sweep kr6z56k5 found [0,0.6] "lost" — but that sweep was graded with FREEZE_VAL_HIGHLIGHTS + VAL_HIGHLIGHT_FALLOFF=0.0, i.e. a SOFT-lobe-only eval that is structurally blind to hard-highlight removal. That result does not measure this failure case; see the eval caveat below.
  HIGHLIGHT_DENSITY:
    value: [0.0, 2.0]  # Concentration (gamma = 1/(1+c)) brightens/saturates the pixels surviving the falloff crop, broadening the pure-white core. Pairs with INTENSITY/FALLOFF to make small, sharp, fully-clipped blobs.
  CLAMP_RECONSTRUCTION:
    value: True  # Clamp reconstructed images to [0, 1] range if True

  ### GEOMETRIC (MICRO-SPECULAR) HIGHLIGHTS
  # Perturbs MoGe normals inside many small blobs (add_geometric_roughness_torch)
  # so the Blinn-Phong pass produces small, sharp, concentrated specular blobs —
  # the exact morphology smooth scene-wide lobes never create and the model
  # currently fails to inpaint. N_BLOBS=0 disables it (legacy behavior).
  # Training-only (blob RNG isn't torch-seedable, so it's kept out of frozen eval).
  GEOMETRIC_HIGHLIGHTS:
    value:
      N_BLOBS: 24            # number of micro-specular blobs per image (0 = off)
      AVG_BLOB_SIZE: 0.04    # mean blob diameter as a fraction of min(H,W) -> small
      SIZE_UNIT: "fraction"  # "fraction" of image, or "pixels"
      SIZE_SPREAD: 0.9       # lognormal spread; >0 => mix of many small + a few larger
      ELONGATION_BIAS: 0.6   # 0=circular, 1=very elongated on average
      ROUGHNESS_STRENGTH: 1.5  # average normal angular deviation (radians) inside blobs

  ### LARGE CONTIGUOUS HIGHLIGHTS  [Problem A: large-hole inpainting]
  # Composites a big, irregular, soft-edged, saturated plateau directly into the
  # highlight map H (make_large_highlight_mask in highlight_render.py). This is
  # the morphology smooth Blinn-Phong lobes and the small micro-blobs above never
  # produce, and is exactly the case the inpainter currently fills with flat gray.
  # PROB=0.0 disables (legacy behaviour). Draws from the global torch RNG.
  LARGE_HIGHLIGHTS:
    value:
      PROB: 0.35          # fraction of TRAINING images that get a large highlight
      COUNT: 1            # blobs per selected image
      SIZE: [0.12, 0.38]  # blob diameter as a fraction of min(H,W) (uniform per blob); "large" vs the small lobes but not frame-dominating
      ELONGATION: 0.5     # 0=circular, ->1 elongated on average
      CORE_FRAC: 0.22     # fraction of radius held at peak before falloff (small -> tight bright core + wide halo, NOT a frame-wide plate)
      PEAK: [0.95, 1.6]   # per-blob peak alpha; straddles 1.0 so ~60% CLIP the core to pure-white 255 (real saturated glare) while the rest stay bright-but-soft
      EDGE_WOBBLE: 0.25   # irregular border amplitude (0..1); low so the blob stays a single coherent region

  # Used ONLY when FREEZE_VAL_HIGHLIGHTS: True (off by default here). Fixed-ish
  # settings + PROB=1.0 so every val image gets one deterministic large hole -> a
  # comparable large-hole metric across runs. Harmless when freezing is off (val
  # uses LARGE_HIGHLIGHTS above, mirroring training).
  VAL_LARGE_HIGHLIGHTS:
    value:
      PROB: 1.0
      COUNT: 1
      SIZE: [0.30, 0.30]
      ELONGATION: 0.4
      CORE_FRAC: 0.22
      PEAK: [1.3, 1.3]
      EDGE_WOBBLE: 0.2

  ### OPTIMIZATION
  LEARNING_RATE:
    value: 1.0e-3  # Base learning rate for optimizer   # DEPRECATED. SETTING LR FOR EACH MODULE ABOVE
  WEIGHT_DECAY:   
    value: 0.0 # L2 regularization weight (0.0 = no weight decay)
  EPOCHS:
    value: 50  # Maximum number of training epochs
  GRADIENT_ACCUMULATION_STEPS:
    value: 1  # Number of steps to accumulate gradients before optimizer step (1 = no accumulation)
  WARMUP:
    value: 400  # Number of warmup steps for learning rate schedule (linear warmup from 0 to LR)
  GRADIENT_CLIPPING_MAX_NORM:
    value: 8  # Maximum gradient norm for clipping (set to -1 to disable clipping)
  LR_SCHEDULER: 
    value: 
      ONPLATEAU:  # ReduceLROnPlateau scheduler (reduces LR when validation metric plateaus)
        PATIENCE: 5  # Number ofd epochs to wait before reducing LR
        FACTOR: 0.1  # Factor by which LR is reduced (new_lr = old_lr * factor)
      COSINE:  # CosineAnnealingLR scheduler (cosine annealing schedule)
        N_PERIODS: 0.5  # Number of cosine periods over training

  REAPPLY_LRS_ON_RESUME:
    value: True  # On --resume-run, overwrite the restored optimizer/scheduler LRs with the per-module LRs above and restart the cosine anneal from them (without this, YAML LR edits are silently ignored on resume).

  OPTIMIZER_BOOTSTRAP_NAME:
    value: "AdamW"  # Optimizer name for initial training phase ("Adam", "SGD", etc.)
  EARLY_STOPPING_PATIENCE:
    value: 20  # Number of epochs without improvement before stopping training
  SAVE_INTERVAL:
    value: 1000  # Number of training steps between model checkpoints
  
  DATASET_HIGHLIGHT_SUPERVISION_THRESHOLD:
    value: 0.01  # Pixel highlights above this threshold (should be low) are excluded from supervision

  ### LOSS WEIGHTS (relative to the total loss, NOT NORMALIZED LATER)                                                                              
  SPECULAR_LOSS_WEIGHT:
    value: 0.0  # Weight for specular component reconstruction loss
  DIFFUSE_LOSS_WEIGHT:
    value: 2.0  # Detail recovery: was 1.0. Tilt the loss (and the inpainter's gradient direction, since DETACH=False) toward pixel-space diffuse reconstruction.
  HIGHLIGHT_LOSS_WEIGHT:
    value: 0.0  # Weight for highlight mask regression loss
  TOKEN_INPAINT_LOSS_WEIGHT:
    value: 1.0  # Weight for token-space inpainting loss (L1 + cosine similarity in feature space)
  IMAGE_RECONSTRUCTION_LOSS_WEIGHT:
    value: 0.0  # Weight for full image reconstruction loss

  HLREG_W_L1:
    value: 1.0  # Weight for L1 loss in highlight regression
  HLREG_USE_CHARB:
    value: True  # Use Charbonnier loss (smooth L1) instead of standard L1 if True
  HLREG_W_DICE:
    value: 0.2  # Weight for Dice loss in highlight regression (for mask overlap)
  HLREG_W_SSIM:
    value: 0.0  # Weight for SSIM loss in highlight regression
  HLREG_W_GRAD:
    value: 0.0  # Weight for gradient loss in highlight regression
  HLREG_W_TV:
    value: 0.0  # Weight for total variation loss in highlight regression
  HLREG_BALANCE_MODE:
    value: "auto"   # Class balancing mode for highlight regression: 'none' | 'auto' | 'pos_weight'
  HLREG_POS_WEIGHT:
    value: 1.0      # Positive class weight (used only if BALANCE_MODE == 'pos_weight')
  HLREG_FOCAL_GAMMA:
    value: 2.0      # Focal loss gamma parameter (0.0 = standard BCE, 1.0-2.0 helps with gradient vanishing)
  
  WEIGHT_SEAM:
    value: 0.1  # Detail recovery: was 0.0. Enforce pixel + gradient consistency on the ring around removed highlights (kills blur/halos at the inpaint boundary).
  RING_DILATE_KERNEL:
    value: 17  # Dilation kernel size (odd number) for creating ring mask around highlights
  SEAM_USE_CHARB:
    value: True  # Use Charbonnier loss instead of L1 in seam loss (smooth L1 for boundary consistency)
  SEAM_WEIGHT_GRAD:
    value: 0.5  # Detail recovery: was 0.0. Match image GRADIENTS across the seam — the only config-available high-frequency term acting on the diffuse output.
  TOKEN_FEAT_ALPHA:
    value: 0.5  # Mixing factor for token feature loss: alpha * L1 + (1-alpha) * (1-cosine_sim)

  ### DIFFUSE HIGHLIGHT PENALTY
  WEIGHT_DIFFUSE_HIGHLIGHT_PENALTY:
    value: 0.05  # Light brightness penalty; large values bias inpaintings toward dark/violet on red CHOLEC scenes
  DIFFUSE_HL_THRESHOLD:
    value: 0.85  # Threshold above which diffuse pixels are penalized as residual highlights
  DIFFUSE_HL_USE_CHARB:
    value: True  # Use Charbonnier loss instead of L1 for diffuse highlight penalty
  DIFFUSE_HL_PENALTY_MODE:
    value: "brightness"  # Penalty mode: "brightness" (penalize brightness/luminance above threshold) or "pixel" (penalize RGB values directly)
  DIFFUSE_HL_TARGET_BRIGHTNESS:
    value: null  # Target brightness/luminance for penalized pixels (null = use threshold value)
  DIFFUSE_HL_USE_LUMINANCE:
    value: False  # If True, use perceptually-weighted luminance (0.299*R + 0.587*G + 0.114*B); if False, use simple mean brightness

  ### LOGGING, RESULTS AND WANDB                                                                 
  LOG_INTERVAL:
    value: 1  # Number of training steps between console log outputs
  WANDB_LOG_INTERVAL:
    value: 1  # Number of training steps between WandB metric logs
  IMAGE_LOG_INTERVAL:
    value: 5  # Number of training steps between image logging to WandB
  NO_WANDB:
    value: False  # Disable WandB logging if True (useful for local debugging)
  MODEL_WATCHER_FREQ_WANDB:
    value: 50  # Frequency (in steps) for logging model parameter histograms to WandB
  WANDB_ENTITY:
    value: "unreflect-anything"  # WandB organization/entity name
  WANDB_PROJECT:
    value: "UnReflectAnything"  # WandB project name
  NOTES:
    value: "large-highlight removal: LARGE_HIGHLIGHTS prob0.35 size[0.12,0.38] domed core-clip peak[0.95,1.6] + prior reach KERNEL9/ITERS12 (=48 tok); keeps geo-blobs N=24 + INTENSITY[0.8,2.5] + FALLOFF[0,0.5] + DENSITY[0,2]"  # Notes/description for this training run